<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация — Bit Issues</title>

    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="border-b bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/#/" class="text-sm font-semibold">Bit Issues</a>
        <div class="flex items-center gap-2" x-data>
          <a
            href="/#/profile"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
          >
            Профиль
          </a>
          <button
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
            @click="$store.auth.logout()"
          >
            Выйти
          </button>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div class="mx-auto max-w-md" x-data="registerPage()" x-init="init()">
        <div class="rounded-xl border bg-white p-6 shadow-sm">
          <div class="mb-5">
            <h1 class="text-lg font-semibold">Регистрация</h1>
            <p class="mt-1 text-sm text-slate-600">Создайте аккаунт по email и паролю</p>
          </div>

          <form class="space-y-4" @submit.prevent="submit()">
            <div>
              <label for="register-email" class="text-sm font-medium text-slate-700">Email</label>
              <input
                id="register-email"
                class="mt-1 w-full rounded-md border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                type="email"
                autocomplete="email"
                required
                x-model="form.email"
              />
            </div>

            <div>
              <label for="register-password" class="text-sm font-medium text-slate-700">Пароль</label>
              <input
                id="register-password"
                class="mt-1 w-full rounded-md border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                type="password"
                autocomplete="new-password"
                required
                x-model="form.password"
              />
              <div class="mt-1 text-xs text-slate-500">Минимум 8 символов.</div>
            </div>

            <div>
              <label for="register-password2" class="text-sm font-medium text-slate-700">Повторите пароль</label>
              <input
                id="register-password2"
                class="mt-1 w-full rounded-md border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                type="password"
                autocomplete="new-password"
                required
                x-model="form.password2"
              />
            </div>

            <div class="flex items-center gap-3">
              <button
                type="submit"
                class="inline-flex shrink-0 items-center rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-60"
                :disabled="loading"
              >
                <span x-text="loading ? '...' : 'Зарегистрироваться'">Зарегистрироваться</span>
              </button>

              <div
                class="min-w-0 flex-1 text-right text-sm text-red-600"
                x-text="error"
                x-show="error"
                x-cloak
              ></div>
            </div>

            <div class="pt-2 text-sm text-slate-600">
              Уже есть аккаунт?
              <a class="underline" href="/#/login">Войти</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
