<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пользователи — Bit Issues</title>

    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="border-b bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/#/" class="text-sm font-semibold">Bit Issues</a>
        <div class="flex items-center gap-2" x-data>
          <a
            href="/#/profile"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
          >
            Профиль
          </a>
          <button
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
            @click="$store.auth.logout()"
          >
            Выйти
          </button>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div x-data="adminUsersPage()" x-init="init()">
        <div class="mb-6 flex items-start justify-between gap-4">
          <div>
            <h1 class="text-lg font-semibold">Пользователи</h1>
            <p class="mt-1 text-sm text-slate-600">Только для администраторов</p>
          </div>
        </div>

        <div class="rounded-xl border bg-white p-4 shadow-sm">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div class="flex flex-wrap items-end gap-3">
              <div>
                <label for="admin-users-filter-status" class="text-xs font-medium text-slate-600">Статус</label>
                <select
                  id="admin-users-filter-status"
                  class="mt-1 rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                  x-model="filter.status"
                >
                  <option value="">Все</option>
                  <option value="pending">pending</option>
                  <option value="active">active</option>
                  <option value="blocked">blocked</option>
                </select>
              </div>
              <div>
                <label for="admin-users-filter-role" class="text-xs font-medium text-slate-600">Роль</label>
                <select
                  id="admin-users-filter-role"
                  class="mt-1 rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                  x-model="filter.role"
                >
                  <option value="">Все</option>
                  <option value="user">user</option>
                  <option value="admin">admin</option>
                </select>
              </div>
              <button
                class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500 disabled:opacity-60"
                @click="applyFilters()"
                :disabled="loading"
              >
                Применить
              </button>
            </div>

            <div class="flex items-center gap-2" x-show="hasPrev() || hasNext()" x-cloak>
              <button
                class="rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                @click="prevPage()"
                :disabled="loading || !hasPrev()"
                x-show="hasPrev()"
                x-cloak
              >
                ←
              </button>
              <button
                class="rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                @click="nextPage()"
                :disabled="loading || !hasNext()"
                x-show="hasNext()"
                x-cloak
              >
                →
              </button>
            </div>
          </div>

          <div class="mt-4" x-show="loading" x-cloak>
            <div class="text-sm text-slate-600">Загрузка…</div>
          </div>

          <div class="mt-4 overflow-x-auto" x-show="!loading" x-cloak>
            <table class="min-w-full text-left text-sm">
              <thead class="border-b text-xs text-slate-500">
                <tr>
                  <th class="px-2 py-2">ID</th>
                  <th class="px-2 py-2">Email</th>
                  <th class="px-2 py-2">Role</th>
                  <th class="px-2 py-2">Status</th>
                  <th class="px-2 py-2">Действия</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                <template x-for="user in users" :key="user.id">
                  <tr>
                    <td class="px-2 py-2 text-slate-500" x-text="user.id"></td>
                    <td class="px-2 py-2 font-medium" x-text="user.email"></td>
                    <td class="px-2 py-2" x-text="user.role"></td>
                    <td class="px-2 py-2" x-text="user.status"></td>
                    <td class="px-2 py-2">
                      <div class="flex flex-wrap items-center gap-2">
                        <button
                          class="rounded-md bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500 disabled:opacity-60"
                          x-show="user.status !== 'active'"
                          x-cloak
                          @click="updateUser(user.id, { status: 'active' })"
                          :disabled="loading"
                        >
                          Активировать
                        </button>
                        <button
                          class="rounded-md bg-rose-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-rose-500 disabled:opacity-60"
                          x-show="user.status !== 'blocked'"
                          x-cloak
                          @click="updateUser(user.id, { status: 'blocked' })"
                          :disabled="loading"
                        >
                          Заблокировать
                        </button>
                        <button
                          class="rounded-md border bg-white px-3 py-1.5 text-xs font-medium hover:bg-slate-50 disabled:opacity-60"
                          x-show="user.role !== 'admin'"
                          x-cloak
                          @click="updateUser(user.id, { role: 'admin' })"
                          :disabled="loading"
                        >
                          Сделать админом
                        </button>
                        <button
                          class="rounded-md border bg-white px-3 py-1.5 text-xs font-medium hover:bg-slate-50 disabled:opacity-60"
                          x-show="user.role !== 'user'"
                          x-cloak
                          @click="updateUser(user.id, { role: 'user' })"
                          :disabled="loading"
                        >
                          Сделать пользователем
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
                <tr x-show="users.length === 0" x-cloak>
                  <td class="px-2 py-4 text-sm text-slate-600" colspan="5">Пока пусто.</td>
                </tr>
              </tbody>
            </table>

            <div class="mt-3 text-xs text-slate-500">
              Показано
              <span x-text="users.length"></span>
              из
              <span x-text="total"></span>.
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
