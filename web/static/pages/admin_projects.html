<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проекты (Admin) — Bit Issues</title>

    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="border-b bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/#/" class="text-sm font-semibold">Bit Issues</a>
        <div class="flex items-center gap-2" x-data>
          <a
            href="/#/profile"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
          >
            Профиль
          </a>
          <button
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
            @click="$store.auth.logout()"
          >
            Выйти
          </button>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div x-data="adminProjectsPage()" x-init="init()">
        <div class="mb-6">
          <h1 class="text-lg font-semibold">Проекты</h1>
          <p class="mt-1 text-sm text-slate-600">Только для администраторов</p>

          <div class="mt-4">
            <button
              class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500 disabled:opacity-60"
              @click="openProjectModal()"
              :disabled="loading"
            >
              Новый проект
            </button>
          </div>
        </div>

        <div class="rounded-xl border bg-white p-4 shadow-sm">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div class="text-sm font-medium text-slate-700">Список</div>

            <div class="flex items-center gap-2" x-show="hasPrev() || hasNext()" x-cloak>
              <button
                class="rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                @click="prevPage()"
                :disabled="loading || !hasPrev()"
                x-show="hasPrev()"
                x-cloak
              >
                ←
              </button>
              <button
                class="rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                @click="nextPage()"
                :disabled="loading || !hasNext()"
                x-show="hasNext()"
                x-cloak
              >
                →
              </button>
            </div>
          </div>

          <div class="mt-3 text-sm text-red-600" x-text="error" x-show="error" x-cloak></div>

          <div class="mt-4" x-show="loading" x-cloak>
            <div class="text-sm text-slate-600">Загрузка…</div>
          </div>

          <div class="mt-4 overflow-x-auto" x-show="!loading" x-cloak>
            <table class="min-w-full text-left text-sm">
              <thead class="border-b text-xs text-slate-500">
                <tr>
                  <th class="px-2 py-2">ID</th>
                  <th class="px-2 py-2">Название</th>
                  <th class="px-2 py-2">Repo URL</th>
                  <th class="px-2 py-2">Метки</th>
                  <th class="px-2 py-2">Действия</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                <template x-for="p in projects" :key="p.id">
                  <tr>
                    <td class="px-2 py-2 text-slate-500" x-text="p.id"></td>
                    <td class="px-2 py-2 font-medium" x-text="p.name"></td>
                    <td class="px-2 py-2">
                      <a class="text-slate-700 underline decoration-slate-300 hover:decoration-slate-500" :href="safeRepoUrl(p.repo_url)" target="_blank" rel="noreferrer" x-text="p.repo_url"></a>
                    </td>
                    <td class="px-2 py-2">
                      <div class="flex flex-wrap gap-1">
                        <template x-for="tag in (p.tags || [])" :key="tag">
                          <span class="rounded-full bg-indigo-100 px-2 py-0.5 text-xs font-medium text-indigo-700" x-text="tag"></span>
                        </template>
                      </div>
                    </td>
                    <td class="px-2 py-2">
                      <div class="flex flex-wrap items-center gap-2">
                        <button
                          class="rounded-md border bg-white px-3 py-1.5 text-xs font-medium hover:bg-slate-50 disabled:opacity-60"
                          @click="openProjectModal(p)"
                          :disabled="loading"
                        >
                          Изменить
                        </button>
                        <button
                          class="rounded-md bg-rose-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-rose-500 disabled:opacity-60"
                          @click="openDeleteModal(p)"
                          :disabled="loading"
                        >
                          Удалить
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
                <tr x-show="projects.length === 0" x-cloak>
                  <td class="px-2 py-4 text-sm text-slate-600" colspan="5">Пока пусто.</td>
                </tr>
              </tbody>
            </table>

            <div class="mt-3 text-xs text-slate-500" x-show="total > 0" x-cloak>
              Показано
              <span x-text="projects.length"></span>
              из
              <span x-text="total"></span>.
            </div>
          </div>
        </div>

        <div
          class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/30 p-4"
          x-show="deleteModal.open"
          x-cloak
          @keydown.escape.window="closeDeleteModal()"
          role="dialog"
          aria-modal="true"
          aria-labelledby="project-delete-modal-title"
        >
          <div class="w-full max-w-xl rounded-xl bg-white shadow-lg">
            <div class="flex items-start justify-between gap-3 border-b p-4">
              <div>
                <div id="project-delete-modal-title" class="text-sm font-semibold">Удаление проекта</div>
                <div class="mt-1 text-xs text-slate-500" x-text="deleteModal.id"></div>
              </div>
              <button
                class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-60"
                @click="closeDeleteModal()"
                :disabled="deleteModal.saving"
              >
                Закрыть
              </button>
            </div>

            <div class="p-4">
              <div class="text-sm text-slate-700">
                Удалить проект
                <span class="font-semibold" x-text="deleteModal.name || deleteModal.id"></span>?
              </div>
              <div class="mt-1 text-sm text-slate-600">Это действие нельзя отменить</div>
              <div class="mt-2 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-800">
                Вместе с проектом будут удалены все связанные задачи, комментарии и вложения.
              </div>

              <div class="mt-3 text-sm text-red-600" x-text="deleteModal.error" x-show="deleteModal.error" x-cloak></div>

              <div class="mt-4 flex items-center justify-end gap-2">
                <button
                  class="rounded-md border bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50 disabled:opacity-60"
                  @click="closeDeleteModal()"
                  :disabled="deleteModal.saving"
                >
                  Отмена
                </button>
                <button
                  class="rounded-md bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-500 disabled:opacity-60"
                  @click="confirmDeleteModal()"
                  :disabled="deleteModal.saving"
                >
                  Удалить
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/30 p-4"
          x-show="projectModal.open"
          x-cloak
          @keydown.escape.window="closeProjectModal()"
        >
          <div class="w-full max-w-xl rounded-xl bg-white shadow-lg">
            <div class="flex items-start justify-between gap-3 border-b p-4">
              <div>
                <div
                  class="text-sm font-semibold"
                  x-text="projectModal.mode === 'create' ? 'Новый проект' : 'Редактирование проекта'"
                ></div>
                <div class="mt-1 text-xs text-slate-500" x-show="projectModal.mode === 'edit'" x-cloak x-text="projectModal.id"></div>
              </div>
              <button
                class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-60"
                @click="closeProjectModal()"
                :disabled="projectModal.saving"
              >
                Закрыть
              </button>
            </div>

            <div class="p-4">
              <div class="grid gap-3">
                <div>
                  <label for="project-name" class="text-xs font-medium text-slate-600">Название</label>
                  <input
                    id="project-name"
                    class="mt-1 w-full rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                    x-model="projectModal.form.name"
                    placeholder="Например, Backend Service"
                  />
                </div>
                <div>
                  <label for="project-repo-url" class="text-xs font-medium text-slate-600">Repo URL</label>
                  <input
                    id="project-repo-url"
                    class="mt-1 w-full rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                    x-model="projectModal.form.repo_url"
                    placeholder="https://bitbucket.org/org/repo"
                  />
                </div>
                <div>
                  <label for="project-tags" class="text-xs font-medium text-slate-600">Метки</label>
                  <input
                    id="project-tags"
                    class="mt-1 w-full rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                    x-model="projectModal.form.tags"
                    placeholder="bug, urgent, frontend"
                  />
                  <p class="mt-1 text-xs text-slate-400">Через запятую</p>
                </div>
              </div>

              <div class="mt-3 text-sm text-red-600" x-text="projectModal.error" x-show="projectModal.error" x-cloak></div>

              <div class="mt-4 flex items-center justify-end gap-2">
                <button
                  class="rounded-md border bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50 disabled:opacity-60"
                  @click="closeProjectModal()"
                  :disabled="projectModal.saving"
                >
                  Отмена
                </button>
                <button
                  class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-60"
                  @click="save()"
                  :disabled="projectModal.saving"
                  x-text="projectModal.mode === 'create' ? 'Создать' : 'Сохранить'"
                ></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
