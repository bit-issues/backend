<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Профиль — Bit Issues</title>

    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="border-b bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/#/" class="text-sm font-semibold">Bit Issues</a>
        <div class="flex items-center gap-2" x-data>
          <a
            href="/#/profile"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
          >
            Профиль
          </a>
          <button
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
            @click="$store.auth.logout()"
          >
            Выйти
          </button>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div x-data="profilePage()" x-init="init()">
        <div class="mb-6">
          <h1 class="text-lg font-semibold">Профиль</h1>
          <p class="mt-1 text-sm text-slate-600">Данные текущего пользователя и смена пароля</p>
        </div>

        <div class="grid gap-4 lg:grid-cols-2">
          <div class="rounded-xl border bg-white p-4 shadow-sm">
            <div class="text-sm font-semibold text-slate-900">Аккаунт</div>
            <div class="mt-3 grid gap-3 text-sm">
              <div class="flex items-center justify-between gap-3">
                <div class="text-slate-600">Имя</div>
                <div class="font-medium text-slate-900" x-text="currentUser.name || '—'"></div>
              </div>
              <div class="flex items-center justify-between gap-3">
                <div class="text-slate-600">Email</div>
                <div class="font-medium text-slate-900" x-text="currentUser.email || '—'"></div>
              </div>
              <div class="flex items-center justify-between gap-3">
                <div class="text-slate-600">Роль</div>
                <div class="font-medium text-slate-900" x-text="currentUser.role || '—'"></div>
              </div>
              <div class="flex items-center justify-between gap-3">
                <div class="text-slate-600">Статус</div>
                <div class="font-medium text-slate-900" x-text="currentUser.status || '—'"></div>
              </div>
            </div>
          </div>

          <div class="rounded-xl border bg-white p-4 shadow-sm">
            <div class="text-sm font-semibold text-slate-900">Смена пароля</div>
            <p class="mt-1 text-sm text-slate-600">Нужен текущий пароль</p>

            <div class="mt-3 text-sm text-emerald-700" x-text="success" x-show="success" x-cloak></div>
            <div class="mt-3 text-sm text-red-600" x-text="error" x-show="error" x-cloak></div>

            <div class="mt-4 grid gap-3">
              <div>
                <label for="profile-old-password" class="text-xs font-medium text-slate-600">Текущий пароль</label>
                <input
                  id="profile-old-password"
                  type="password"
                  autocomplete="current-password"
                  class="mt-1 w-full rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                  x-model="form.old_password"
                  :disabled="loading"
                />
              </div>
              <div>
                <label for="profile-new-password" class="text-xs font-medium text-slate-600">Новый пароль</label>
                <input
                  id="profile-new-password"
                  type="password"
                  autocomplete="new-password"
                  class="mt-1 w-full rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                  x-model="form.new_password"
                  :disabled="loading"
                />
              </div>
              <div>
                <label for="profile-new-password2" class="text-xs font-medium text-slate-600">Повторите новый пароль</label>
                <input
                  id="profile-new-password2"
                  type="password"
                  autocomplete="new-password"
                  class="mt-1 w-full rounded-md border bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
                  x-model="form.new_password2"
                  :disabled="loading"
                />
              </div>
            </div>

            <div class="mt-4 flex items-center justify-end gap-2">
              <button
                class="rounded-md border bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50 disabled:opacity-60"
                @click="resetForm()"
                :disabled="loading"
              >
                Очистить
              </button>
              <button
                class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-60"
                @click="submit()"
                :disabled="loading"
              >
                Сменить пароль
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
