<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Дашборды — Bit Issues</title>

    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="border-b bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/#/" class="text-sm font-semibold">Bit Issues</a>
        <div class="flex items-center gap-2" x-data>
          <a
            href="/#/profile"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
          >
            Профиль
          </a>
          <button
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
            @click="$store.auth.logout()"
          >
            Выйти
          </button>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div x-data>
        <div class="mb-6 flex items-start justify-between gap-4">
          <div>
            <h1 class="text-lg font-semibold">Дашборды</h1>
            <p class="mt-1 text-sm text-slate-600">Выберите нужный дашборд</p>
          </div>
          <a href="/#/" class="rounded-md border bg-white px-3 py-2 text-sm font-medium hover:bg-slate-50">
            Назад
          </a>
        </div>

        <div class="grid gap-3 sm:grid-cols-2">
          <a
            href="/#/dashboards/personal"
            class="rounded-xl border bg-white p-4 shadow-sm hover:bg-slate-50"
          >
            <div class="text-sm font-semibold">Личный</div>
            <div class="mt-1 text-sm text-slate-600">Созданные мной и назначенные на меня</div>
          </a>

          <a
            href="/#/dashboards/tasks"
            class="rounded-xl border bg-white p-4 shadow-sm hover:bg-slate-50"
          >
            <div class="text-sm font-semibold">Все задачи</div>
            <div class="mt-1 text-sm text-slate-600">Общий список задач по всем проектам</div>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
