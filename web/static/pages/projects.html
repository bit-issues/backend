<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проекты — Bit Issues</title>

    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="border-b bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/#/" class="text-sm font-semibold">Bit Issues</a>
        <div class="flex items-center gap-2" x-data>
          <a
            href="/#/profile"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
          >
            Профиль
          </a>
          <button
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
            @click="$store.auth.logout()"
          >
            Выйти
          </button>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div x-data="projectsPage()" x-init="init()">
        <div class="mb-6">
          <h1 class="text-lg font-semibold">Проекты</h1>
          <p class="mt-1 text-sm text-slate-600">Выберите проект, чтобы перейти к его задачам</p>
        </div>

        <div
          class="mb-4 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-800"
          x-show="notice"
          x-text="notice"
          x-cloak
        ></div>

        <div class="rounded-xl border bg-white p-4 shadow-sm">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div class="text-sm font-medium text-slate-700">Список</div>

            <div class="flex items-center gap-2" x-show="hasPrev() || hasNext()" x-cloak>
              <button
                class="rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                @click="prevPage()"
                :disabled="loading || !hasPrev()"
                x-show="hasPrev()"
                x-cloak
              >
                ←
              </button>
              <button
                class="rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                @click="nextPage()"
                :disabled="loading || !hasNext()"
                x-show="hasNext()"
                x-cloak
              >
                →
              </button>
            </div>
          </div>

          <div class="mt-4" x-show="loading" x-cloak>
            <div class="text-sm text-slate-600">Загрузка…</div>
          </div>

          <div class="mt-4 overflow-x-auto" x-show="!loading" x-cloak>
            <table class="min-w-full text-left text-sm">
              <thead class="border-b text-xs text-slate-500">
                <tr>
                  <th class="px-2 py-2">Название</th>
                  <th class="px-2 py-2">Repo URL</th>
                  <th class="px-2 py-2 text-right">Действия</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                <template x-for="p in projects" :key="p.id">
                  <tr class="cursor-pointer hover:bg-slate-50" @click="openProject(p)">
                    <td class="px-2 py-2">
                      <a
                        class="font-medium text-slate-900 underline decoration-slate-200 hover:decoration-slate-400"
                        :href="projectTasksHref(p)"
                        x-text="p.name"
                      ></a>
                    </td>
                    <td class="px-2 py-2" @click.stop>
                      <a
                        class="text-slate-700 underline decoration-slate-300 hover:decoration-slate-500"
                        :href="safeRepoUrl(p.repo_url)"
                        target="_blank"
                        rel="noreferrer"
                        x-text="p.repo_url"
                      ></a>
                    </td>
                    <td class="px-2 py-2 text-right" @click.stop>
                      <a
                        class="inline-flex rounded-md border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
                        :href="projectTasksHref(p)"
                      >
                        Задачи
                      </a>
                      <a
                        class="ml-2 inline-flex rounded-md bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-500"
                        :href="`/#/tasks/new/${encodeURIComponent(p.id)}`"
                        @click="$store.nav.touchProject({ id: p.id, name: p.name })"
                      >
                        Создать задачу
                      </a>
                    </td>
                  </tr>
                </template>
                <tr x-show="projects.length === 0" x-cloak>
                  <td class="px-2 py-4 text-sm text-slate-600" colspan="3">Пока пусто.</td>
                </tr>
              </tbody>
            </table>

            <div class="mt-3 text-xs text-slate-500" x-show="total > 0" x-cloak>
              Показано
              <span x-text="projects.length"></span>
              из
              <span x-text="total"></span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
