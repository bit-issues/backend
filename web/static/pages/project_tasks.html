<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Задачи проекта — Bit Issues</title>

  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <script defer src="/static/js/api.js"></script>
  <script defer src="/static/js/app.js"></script>
  <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
  <div class="border-b bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a href="/#/" class="text-sm font-semibold">Bit Issues</a>
      <div class="flex items-center gap-2" x-data>
        <a href="/#/profile" class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
          x-show="$store.auth.token" x-cloak>
          Профиль
        </a>
        <button class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
          x-show="$store.auth.token" x-cloak @click="$store.auth.logout()">
          Выйти
        </button>
      </div>
    </div>
  </div>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <div x-data="projectTasksPage()" x-init="init()">
      <div class="mb-6">
        <a href="/#/projects"
          class="text-sm text-slate-600 underline decoration-slate-300 hover:text-slate-900 hover:decoration-slate-500">
          ← Все проекты
        </a>
        <h1 class="mt-2 text-lg font-semibold" x-text="projectName || projectSlug"></h1>
        <p class="mt-1 text-sm text-slate-600">Задачи проекта</p>
      </div>

      <div class="mb-4 flex flex-wrap items-center gap-2">
        <a class="inline-flex rounded-md bg-emerald-600 px-3 py-2 text-sm font-medium text-white hover:bg-emerald-500"
          :href="`/#/tasks/new/${encodeURIComponent(projectSlug)}`">
          Создать задачу
        </a>
        <a class="inline-flex rounded-md border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
          :href="safeRepoUrl(project && project.repo_url)" target="_blank" rel="noreferrer"
          x-show="project && project.repo_url" x-cloak>
          Репозиторий
        </a>
      </div>

      <div class="mb-4">
        <div class="text-xs font-medium text-slate-500 mb-1.5">Статус</div>
        <div class="flex flex-wrap gap-1.5">
          <template x-for="s in window.TASK_STATUSES" :key="s">
            <button class="rounded-full px-3 py-1 text-xs font-medium transition-colors"
              :class="isStatusActive(s) ? 'bg-indigo-100 text-indigo-700 ring-1 ring-indigo-300' : 'bg-slate-100 text-slate-600 ring-1 ring-slate-200 hover:bg-slate-200'"
              @click="toggleStatus(s)" x-text="s"></button>
          </template>
          <button x-show="hasActiveFilters()" x-cloak
            class="rounded-full px-3 py-1 text-xs font-medium text-rose-600 ring-1 ring-rose-200 hover:bg-rose-50"
            @click="clearFilters()">
            Сбросить
          </button>
        </div>
      </div>

      <div class="rounded-xl border bg-white p-4 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <div class="text-sm font-semibold">Список задач</div>
            <div class="mt-0.5 text-xs text-slate-500" x-text="paginationText()"></div>
          </div>
          <div class="flex items-center gap-2">
            <button
              class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-50"
              @click="prevPage()" :disabled="loading || !hasPrev()">
              ←
            </button>
            <button
              class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-50"
              @click="nextPage()" :disabled="loading || !hasNext()">
              →
            </button>
          </div>
        </div>

        <div class="mt-4" x-show="loading" x-cloak>
          <div class="text-sm text-slate-600">Загрузка…</div>
        </div>

        <ul class="mt-4 divide-y" x-show="!loading" x-cloak>
          <template x-for="t in items" :key="t.id">
            <li class="py-3">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <a class="block truncate text-sm font-semibold underline decoration-slate-200 hover:decoration-slate-400"
                    :href="`/#/tasks/${t.id}`" x-text="t.title"></a>
                  <div class="mt-0.5 flex flex-wrap gap-x-3 gap-y-1 text-xs text-slate-600">
                    <span x-text="t.project_slug ? t.project_slug + ' #' + t.number : ('#' + t.number)"></span>
                    <span class="rounded px-2 py-0.5" :class="STATUS_CLASSES[t.status]" x-text="t.status"></span>
                    <span class="rounded px-2 py-0.5" :class="PRIORITY_CLASSES[t.priority]" x-text="t.priority"></span>
                    <span class="rounded bg-slate-100 px-2 py-0.5" x-show="t.kind" x-cloak x-text="t.kind"></span>
                    <span x-show="t.due_date" x-cloak x-text="'due: ' + t.due_date"></span>
                  </div>
                </div>
                <div class="shrink-0 text-xs text-slate-500" x-text="formatDate(t.created_at)"></div>
              </div>
            </li>
          </template>
          <li class="py-3 text-sm text-slate-600" x-show="items.length === 0" x-cloak>Пока пусто.</li>
        </ul>
      </div>
    </div>
  </main>
</body>

</html>
