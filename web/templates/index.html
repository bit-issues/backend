<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bit Issues</title>

    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <link rel="stylesheet" href="/static/css/markdown.css" />
    <link rel="stylesheet" href="/static/css/markdown-editor.css" />
    <script defer src="/static/vendor/marked/marked.min.js"></script>
    <script defer src="/static/vendor/dompurify/purify.min.js"></script>
    <script defer src="/static/vendor/markdown-text-editor/markdown-text-editor.min.js"></script>
    <script defer src="/static/js/markdown.js"></script>
    <script defer src="/static/js/markdown-editor.js"></script>
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
        <a href="/#/dashboards/personal" class="text-sm font-semibold">Bit Issues</a>
        <div class="flex items-center gap-2" x-data>
          <a
            href="/#/profile"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
          >
            Профиль
          </a>
          <button
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            x-show="$store.auth.token"
            x-cloak
            @click="$store.auth.logout()"
          >
            Выйти
          </button>
        </div>
      </div>
    </header>

    <div class="mx-auto w-full max-w-6xl p-4 sm:p-6">
      <div class="flex gap-4 sm:gap-6">
        <aside
          class="w-56 shrink-0 rounded-xl border border-slate-200 bg-white p-4"
          x-show="$store.nav.showSidebar()"
          x-cloak
        >
          <nav class="space-y-1 text-sm" aria-label="Основная навигация">
            <a
              href="/#/dashboards/personal"
              class="block rounded-md px-3 py-2 font-medium transition-colors"
              :class="
                $store.nav.isActive('/dashboards/personal')
                  ? 'bg-slate-900 text-white'
                  : 'text-slate-700 hover:bg-slate-100'
              "
            >
              Моя сводка
            </a>
            <div class="pt-3">
              <a
                href="/#/projects"
                class="block rounded-md px-3 py-2 font-medium transition-colors"
                :class="
                  $store.nav.isActive('/projects')
                    ? 'bg-slate-900 text-white'
                    : 'text-slate-700 hover:bg-slate-100'
                "
              >
                Проекты
              </a>

              <div
                class="mt-2 ml-1 space-y-0.5 border-l border-slate-200 pl-2"
                x-show="$store.nav.recentProjects.length > 0"
                x-cloak
              >
                <p class="px-2 pb-0.5 text-xs font-medium text-slate-400">Недавние</p>
                <ul class="space-y-0.5">
                  <template x-for="p in $store.nav.recentProjects" :key="p.id">
                    <li>
                      <a
                        :href="$store.nav.projectTasksHref(p.id)"
                        class="block truncate rounded-md px-2 py-1.5 text-sm transition-colors"
                        :class="
                          $store.nav.isRecentProjectActive(p.id)
                            ? 'bg-slate-100 font-medium text-slate-900'
                            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                        "
                        :title="p.name"
                        x-text="p.name"
                      ></a>
                    </li>
                  </template>
                </ul>
              </div>
            </div>

            <a
              href="/#/dashboards/tasks"
              class="mt-3 block rounded-md px-3 py-2 font-medium transition-colors"
              :class="
                $store.nav.isActive('/dashboards/tasks')
                  ? 'bg-slate-900 text-white'
                  : 'text-slate-700 hover:bg-slate-100'
              "
            >
              Все задачи
            </a>

            <a
              href="/#/admin"
              class="mt-3 block rounded-md px-3 py-2 font-medium transition-colors"
              :class="
                $store.nav.isActive('/admin')
                  ? 'bg-slate-900 text-white'
                  : 'text-slate-700 hover:bg-slate-100'
              "
              x-show="$store.auth.user && $store.auth.user.role === 'admin'"
              x-cloak
            >
              Администрирование
            </a>
          </nav>
        </aside>

        <div id="spa-root" class="min-w-0 flex-1">
          <div class="text-sm text-slate-600">Загрузка…</div>
        </div>
      </div>
    </div>
  </body>
</html>
